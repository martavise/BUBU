<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <meta name="description" content="Uno spazio personale creativo, semplice e colorato.">
  <title>Bubu ♡</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="decor decor-one" aria-hidden="true"></div>
    <div class="decor decor-two" aria-hidden="true"></div>
    <section class="welcome-card" aria-labelledby="welcome-title">
      <div class="sparkle" aria-hidden="true">✳</div>
      <p class="eyebrow">TEST PAGINA CARINA</p>
      <h1 id="welcome-title">Ciao, <span>bubu.</span></h1>
      <p class="intro">
        Sto provando a vedere come si caricano le pagine su github,
        quando sarà fatto potremo mangiare
      </p>
      <div class="actions">
        <button class="button button-primary" type="button" data-page="tofu">
          Tofu <span aria-hidden="true">♡</span>
        </button>

        <button class="button button-secondary" type="button" data-page="bubi">
          Bubi <span aria-hidden="true">♡</span>
        </button>
      </div>

      <div class="card-footer">
        <span>SOSPETTO</span>
        <span>© <span id="current-year"></span></span>
      </div>
    </section>
    
<!-- Quadrante Tofu -->
<section class="content-card" id="page-tofu" hidden>
  <h2>SIIIII Tofu ♡</h2>
  <p>tofu tofu tofu (e non solo)</p>

  <div class="image-grid">
    <img src="images/foto1.jpg" alt="Ricordo 1">
    <img src="images/foto2.jpg" alt="Ricordo 2">
    <img src="images/foto3.jpg" alt="Ricordo 3">
    <img src="images/foto4.jpg" alt="Ricordo 4">
  </div>

  <button class="button button-primary" type="button" data-home>
    ← Torna indietro
  </button>
</section>

  <!-- Quadrante Bubi -->
  <section class="content-card" id="page-bubi" hidden>
    <h2>mmmm .... ♡</h2>
    <p>SOSPETTO</p>

    <div class="image-grid">
      <img src="images/foto5.jpg" alt="Ricordo 5">
      <img src="images/foto6.jpg" alt="Ricordo 6">
    </div>

    <button class="button button-secondary" type="button" data-home>
      ← Torna indietro
    </button>
  </section>

    <p class="under-note" id="progetti">baci baci</p>
  </main>
</body>
</html>
